<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{paginas/plantillas/plantilla :: head}"></head>

<body>

<header th:replace="~{paginas/plantillas/plantilla :: header}"></header>

<main class="container text-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
    <div class="d-flex justify-content-between mb-3">
        <h1>Lista de Asesorías</h1>
        <a th:href="@{/asesorias/nuevo}" class="btn btn-primary">Nueva Asesoría</a>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Alumno</th>
            <th>Profesor</th>
            <th>Materia</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="a : ${asesorias}">
            <td th:text="${a.alumno.usuario != null ? a.alumno.usuario.nombre : 'Sin nombre'}"></td>
            <td th:text="${a.profesor.nombre}"></td>
            <td th:text="${a.materia.nombre}"></td>
            <td th:text="${a.fecha}"></td>
            <td th:text="${a.hora}"></td>

            <td>
                <a th:href="@{/asesorias/editar/{id}(id=${a.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/asesorias/eliminar/{id}(id=${a.id})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
            <!--Si no esta cancelada  o complestada no muestra el boton -->
            <td th:if="${asesoria.estado != 'cancelada' and asesoria.estado != 'completada'}">
                <form th:action="@{/alumno/asesorias/{id}/cancelar(id=${asesoria.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit">Cancelar</button>
                </form>
            </td>
        </tr>
        </tbody>
        <tr th:each="asesoria : ${asesorias}">
            <td th:text="${asesoria.fecha}"></td>
            <td th:text="${asesoria.hora}"></td>
            <td th:text="${asesoria.estado}"></td>

            <td>
                <form th:action="@{/profesor/asesorias/{id}/estado(id=${asesoria.id})}" method="post">

                    <select name="estado">
                        <option value="pendiente" th:selected="${asesoria.estado == 'pendiente'}">Pendiente</option>
                        <option value="confirmada" th:selected="${asesoria.estado == 'confirmada'}">Confirmada</option>
                        <option value="completada" th:selected="${asesoria.estado == 'completada'}">Completada</option>
                        <option value="cancelada" th:selected="${asesoria.estado == 'cancelada'}">Cancelada</option>
                    </select>

                    <button type="submit">Actualizar</button>
                </form>
            </td>
        </tr>
    </table>
</main>

<footer th:replace="~{paginas/plantillas/plantilla :: footer}"></footer>

</body>
</html>
