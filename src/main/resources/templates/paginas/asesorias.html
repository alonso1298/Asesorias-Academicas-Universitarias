<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head th:replace="~{paginas/plantillas/plantilla :: head}"></head>

<body>

<header th:replace="~{paginas/plantillas/plantilla :: header}"></header>

<main class="container text-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
    <div class="d-flex justify-content-between mb-3">
        <h1>Lista de Asesorías</h1>
        <div sec:authorize="hasRole('ALUMNO')">
            <a th:href="@{/asesorias/nuevo}" class="btn btn-primary">Nueva Asesoría</a>
        </div>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
        <tr>
            <th>Alumno</th>
            <th>Profesor</th>
            <th>Materia</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Notas</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
            <tr th:each="a : ${asesorias}">
                <td th:text="${a.alumno.usuario != null ? a.alumno.usuario.nombre : 'Sin nombre'}"></td>
                <td th:text="${a.profesor.nombre}"></td>
                <td th:text="${a.materia.nombre}"></td>
                <td th:text="${a.fecha}"></td>
                <td th:text="${a.hora}"></td>
                <td th:text="${a.notas}"></td>

                <!-- Acciones normales -->
                <td>
                    <a th:href="@{/asesorias/editar/{id}(id=${a.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/asesorias/eliminar/{id}(id=${a.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
                <!-- Estado + acciones -->
                <td>
                    <!-- SOLO ADMIN -->
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/asesorias/editar/{id}(id=${a.id})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>
                    <!-- SOLO ADMIN -->
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/asesorias/eliminar/{id}(id=${a.id})}"
                       class="btn btn-danger btn-sm">
                        Eliminar
                    </a>
                    <!-- SOLO PROFESOR -->
                    <form sec:authorize="hasRole('PROFESOR')"
                          th:action="@{/profesores/asesorias/{id}/estado(id=${a.id})}"
                          method="post"
                          class="d-flex gap-2">

                        <select name="estado" class="form-select form-select-sm">
                            <option value="pendiente">Pendiente</option>
                            <option value="confirmada">Confirmada</option>
                            <option value="completada">Completada</option>
                            <option value="cancelada">Cancelada</option>
                        </select>
                        <button type="submit"
                                class="btn btn-primary btn-sm">
                            Actualizar
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{paginas/plantillas/plantilla :: footer}"></footer>

</body>
</html>
