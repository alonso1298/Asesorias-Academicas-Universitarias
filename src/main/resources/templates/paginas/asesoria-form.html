<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{paginas/plantillas/plantilla :: head}"></head>

<body>
    <header th:replace="~{paginas/plantillas/plantilla :: header}"></header>

    <main class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-primary text-white text-center rounded-top-4">
                        <h3 class="mb-0"
                            th:text="${asesoria.id != null ? 'Editar Asesoría' : 'Nueva Asesoría'}">
                        </h3>
                    </div>
                    <div class="card-body p-4">
                        <!-- Error -->
                        <div th:if="${error}" class="alert alert-danger">
                            <span th:text="${error}"></span>
                        </div>
                        <form th:action="@{/alumnos/asesorias}"
                              th:object="${asesoria}"
                              method="post">
                            <!-- Profesor -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Profesor</label>
                                <select th:field="*{profesor}" class="form-select">
                                    <option value="">Seleccione un profesor</option>
                                    <option th:each="p : ${profesores}"
                                            th:value="${p.idProfesor}"
                                            th:text="${p.nombre}">
                                    </option>
                                </select>
                            </div>
                            <!-- Materia -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Materia</label>
                                <select th:field="*{materia}" class="form-select">
                                    <option value="">Seleccione una materia</option>
                                    <option th:each="m : ${materias}"
                                            th:value="${m.idMateria}"
                                            th:text="${m.nombre}">
                                    </option>
                                </select>
                            </div>
                            <!-- Fecha y Hora -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Fecha</label>
                                    <input type="date"
                                           th:field="*{fecha}"
                                           class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Hora</label>
                                    <input type="time"
                                           th:field="*{hora}"
                                           class="form-control">
                                </div>
                            </div>
                            <!-- Notas -->
                            <div class="mb-3 text-danger">
                                <label for="notas" class="form-label">
                                    Describe el tema de la asesoría
                                </label>
                                <textarea
                                        th:field="*{notas}"
                                        id="notas"
                                        class="form-control"
                                        rows="4"
                                        placeholder="Ejemplo: Necesito ayuda para el examen de computacion">
                                </textarea>
                                <div th:if="${#fields.hasErrors('notas')}"
                                     th:errors="*{notas}"
                                     class="text-danger mt-1">
                                </div>
                            </div>
                            <!-- Botones -->
                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/alumnos/asesorias}"
                                   class="btn btn-outline-secondary px-4">
                                    Cancelar
                                </a>
                                <button type="submit"
                                        class="btn btn-success px-4">
                                    Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{paginas/plantillas/plantilla :: footer}"></footer>
</body>
</html>
