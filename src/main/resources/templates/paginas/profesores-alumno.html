<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">

<head th:replace="~{paginas/plantillas/plantilla :: head}"></head>

<body>

<header th:replace="~{paginas/plantillas/plantilla :: header}"></header>

    <main class="container mt-5">
        <h2 class="text-center mb-4">Profesores disponibles</h2>
        <div class="row">
            <div class="col-md-4 mb-4" th:each="p : ${profesores}">
                <div class="card shadow-sm h-100">
                    <div class="card-body">

                        <h5 class="card-title" th:text="${p.usuario.nombre}"></h5>

                        <p class="card-text">
                            <strong>Email:</strong>
                            <span th:text="${p.usuario.email}"></span>
                        </p>
                        <!-- Si tienes más info -->
                        <p class="card-text">
                            <strong>Especialidad:</strong>
                            <span th:text="${p.especialidad}"></span>
                        </p>

                    </div>
                </div>
            </div>
        </div>
    </main>

<footer th:replace="~{paginas/plantillas/plantilla :: footer}"></footer>

</body>
</html>
