<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Asesoría</title>
</head>
<body>

<h1>Registrar / Editar Asesoría</h1>

<!-- 🔥 MENSAJE DE ERROR -->
<div th:if="${error}" style="color:red;">
    <p th:text="${error}"></p>
</div>

<form th:action="@{/asesorias/guardar}" th:object="${asesoria}" method="post">

    <input type="hidden" th:field="*{id}"/>

    <!-- ALUMNO -->
    <label>Alumno:</label>
    <label>
        <select th:field="*{alumno}" required>
            <option value="">Seleccione</option>
            <option th:each="a : ${alumnos}"
                    th:value="${a.id}"
                    th:text="${a.matricula}">
            </option>
        </select>
    </label>
    <br><br>

    <!-- PROFESOR -->
    <label>Profesor:</label>
    <label>
        <select th:field="*{profesor}" required>
            <option value="">Seleccione</option>
            <option th:each="p : ${profesores}"
                    th:value="${p.id}"
                    th:text="${p.nombre}">
            </option>
        </select>
    </label>
    <br><br>

    <!-- MATERIA -->
    <label>Materia:</label>
    <label>
        <select th:field="*{materia}" required>
            <option value="">Seleccione</option>
            <option th:each="m : ${materias}"
                    th:value="${m.id}"
                    th:text="${m.nombre}">
            </option>
        </select>
    </label>
    <br><br>

    <!-- FECHA -->
    <label>Fecha:</label>
    <label>
        <input type="date" th:field="*{fecha}" required/>
    </label>
    <br><br>

    <!-- HORA -->
    <label>Hora:</label>
    <label>
        <input type="time" th:field="*{hora}" required/>
    </label>
    <br><br>

    <!-- ESTADO -->
    <label>Estado:</label>
    <label>
        <select th:field="*{estado}">
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="completada">Completada</option>
            <option value="cancelada">Cancelada</option>
        </select>
    </label>
    <br><br>

    <!-- NOTAS -->
    <label>Notas:</label>
    <label>
        <textarea th:field="*{notas}"></textarea>
    </label>
    <br><br>

    <button type="submit">Guardar</button>
</form>

<br>
<a th:href="@{/asesorias}">Volver</a>

</body>
</html>
